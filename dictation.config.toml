# Voice dictation settings.
#
# Restart `npm run dev` or `npm run preview` after changing this file.
#
# Never put the Speechmatics API key here: this file is committed. Put the key
# in .env.local as SPEECHMATICS_API_KEY. SPEECHMATICS_MODEL,
# SPEECHMATICS_LANGUAGE and SPEECHMATICS_RT_URL in .env.local override the
# matching [speechmatics] settings below for your machine only.

[speechmatics]
# Model: "enhanced" (most accurate) or "standard" (fastest).
# "melia-1" is a multilingual preview for evaluation only; see the README.
model = "enhanced"

# Language code, such as "en" or "de", or a bilingual pack such as "cmn_en".
# Use "multi" with "melia-1".
language = "en"

# Realtime endpoint. Regional endpoints: eu, us and au.
realtime_url = "wss://eu.rt.speechmatics.com/v2"

[timings]
# Stop dictation after this many seconds without recognised speech. Only
# recognised words count: microphone sound that produces no words does not.
inactivity_timeout_seconds = 15

# Maximum length of one dictation session, however much speech is recognised,
# counted from when the microphone starts recording.
max_session_seconds = 60

# After dictation stops, how long recognised text may keep settling.
settle_timeout_seconds = 4
